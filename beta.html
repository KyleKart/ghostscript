<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>GhostScript V2 Beta</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background: #f0f0f0;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }

        pre {
            background: #222;
            color: #eee;
            padding: 15px;
            overflow-x: auto;
            white-space: pre-wrap;
            border-radius: 4px;
            margin-top: 20px;
            min-height: 100px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 20px;
        }

        #consoleOutput {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        ghost {
            display: none !important;
        }
    </style>
</head>

<body>

    <h1>GhostScript Playground</h1>

    <textarea id="ghostSource" spellcheck="false">
out("Hello from GhostScript!")
var name = "Casper"
out("Ghost name: " .+ name .+ " the friendly spirit")

for (10)
  per (3)
    out("Tick on index: " .+ i)
  end
end
  </textarea>

    <label>Output JavaScript:</label>
    <pre id="jsOutput">// Transformed JS will appear here</pre>

    <button id="runBtn">Run</button>

    <h2>Console output:</h2>
    <pre id="consoleOutput">// Output appears here</pre>

    <ghost id="runner"></ghost>

    <script>
        const consoleOutput = document.getElementById('consoleOutput');
        const jsOutput = document.getElementById('jsOutput');
        const originalLog = console.log;
        const originalErr = console.error;

        console.log = (...args) => {
            consoleOutput.textContent += args.join(' ') + '\n';
            originalLog(...args);
        };

        console.error = (...args) => {
            consoleOutput.textContent += '[ERR] ' + args.join(' ') + '\n';
            originalErr(...args);
        };

        function parseGhostScript(ghostSource) {
            let ghostCode = ghostSource;

            // 1. Fix String Concatenation Chaining Bug
            // Converts all variations of ".+" to native JS string addition safely
            ghostCode = ghostCode.replace(/(.+?)\s*\.\+\s*(.+?)(?=\n|;|$)/g, (match) => {
                return match.split('.+').map(part => `String(${part.trim()})`).join(' + ');
            });
            // 2. Global replacements (accounting for basic word boundaries)
            ghostCode = ghostCode.replace(/out\((.*?)\)/g, 'console.log($1)');
            ghostCode = ghostCode.replace(/err\((.*?)\)/g, 'console.error($1)');
            ghostCode = ghostCode.replace(/\bvar\b/g, 'let');

            // 3. Fix: Ensure loop scope tracks dynamic iteration counts using an execution stack index
            let loopDepth = 0;
            ghostCode = ghostCode.replace(/for\s*\(\s*(\d+|\w+)\s*\)/g, (match, count) => {
                const iterVar = loopDepth === 0 ? 'i' : `i_${loopDepth}`;
                loopDepth++;
                return `for (let ${iterVar} = 0; ${iterVar} < ${count}; ${iterVar}++)`;
            });

            ghostCode = ghostCode.replace(/borrow\s+"(\w+)"/g, 'const $1 = await import("./ghost-modules/$1.js")');

            const lines = ghostCode.split('\n').map(line => line.trim());
            const controlKeywords = ['if', 'else if', 'else', 'while', 'switch', 'for'];

            let outputLines = [];
            let blockStack = [];
            let wsVar = null;
            let activeLoopIndex = 'i';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                if (line === '' || line.startsWith('//')) continue;

                // Track local loop iterator contexts for the "per" keyword
                const loopMatch = line.match(/for\s*\(let\s+(\w+)/);
                if (loopMatch) {
                    activeLoopIndex = loopMatch[1];
                }

                const fnMatch = line.match(/^fn\s+(\w+)\s*\((.*?)\)/);
                if (fnMatch) {
                    outputLines.push(`function ${fnMatch[1]}(${fnMatch[2]}) {`);
                    blockStack.push('block');
                    continue;
                }

                const fromMatch = line.match(/^from\s*\(\s*(\w+)\s*\)/);
                if (fromMatch) {
                    wsVar = fromMatch[1];
                    outputLines.push(`${wsVar}.onmessage = async (event) => {`);
                    blockStack.push('from');
                    continue;
                }

                // 4. Fix: 'per' now automatically checks the correct parent iterator variable name
                const perMatch = line.match(/^per\s*\(\s*(\d+)\s*\)$/);
                if (perMatch) {
                    const n = perMatch[1];
                    outputLines.push(`if (${activeLoopIndex} % ${n} === 0) {`);
                    blockStack.push('block');
                    continue;
                }

                if (blockStack.includes('from') && wsVar && line.includes(`${wsVar}.msg`)) {
                    line = line.replaceAll(`${wsVar}.msg`, 'event.data');
                }

                const wssMatch = line.match(/^let\s+(\w+)\s*=\s*wss\((.+?)\)/);
                if (wssMatch) {
                    const [_, varName, expr] = wssMatch;
                    outputLines.push(`let ${varName} = new WebSocket("wss://" + ${expr});`);
                    continue;
                }

                const matchedControl = controlKeywords.some(kw => {
                    const regex = new RegExp(`^${kw}(\\s|\\()`);
                    return regex.test(line);
                });

                if (matchedControl) {
                    outputLines.push(line + ' {');
                    blockStack.push('block');
                    continue;
                }

                if (line === 'end') {
                    if (blockStack.length > 0) {
                        outputLines.push('}');
                        blockStack.pop();
                        // Reset iterator lookup reference on loop exit
                        if (loopDepth > 0) {
                            loopDepth--;
                            activeLoopIndex = loopDepth === 0 ? 'i' : `i_${loopDepth - 1}`;
                        }
                    } else {
                        outputLines.push('// stray end');
                    }
                    continue;
                }

                outputLines.push(line);
            }

            while (blockStack.length > 0) {
                outputLines.push('}');
                blockStack.pop();
            }

            return outputLines.join('\n');
        }

        // 5. Fix: Global script isolation to stop runner blocks from overwriting one another
        function runGhostTags() {
            const blocks = document.querySelectorAll('ghost');

            blocks.forEach(block => {
                const isExternal = block.hasAttribute('src');
                const runCode = code => {
                    const parsed = parseGhostScript(code);
                    try {
                        // Evaluates code in a completely isolated local function scope context
                        const execWrapper = new Function(`return (async () => {\n${parsed}\n})()`);
                        execWrapper();
                    } catch (e) {
                        console.error('GhostScript runtime error:', e);
                    }
                };

                if (isExternal) {
                    const src = block.getAttribute('src');
                    fetch(src)
                        .then(res => res.text())
                        .then(runCode)
                        .catch(err => {
                            console.error(`GhostScript failed to load "${src}":`, err);
                        });
                } else {
                    runCode(block.textContent);
                }
            });
        }

        document.getElementById('runBtn').addEventListener('click', () => {
            const code = document.getElementById('ghostSource').value;
            document.getElementById('runner').textContent = code;
            consoleOutput.textContent = '';

            const transformed = parseGhostScript(code);
            jsOutput.textContent = transformed;

            runGhostTags();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runGhostTags);
        } else {
            runGhostTags();
        }
    </script>

</body>

</html>
