<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>GhostScript V2 Beta</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f0f0f0;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 200px;
      font-family: monospace;
      font-size: 14px;
      margin-bottom: 10px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
    }

    pre {
      background: #222;
      color: #eee;
      padding: 15px;
      overflow-x: auto;
      white-space: pre-wrap;
      border-radius: 4px;
      margin-top: 20px;
      min-height: 100px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 20px;
    }

    #consoleOutput {
      background: #000;
      color: #0f0;
      font-family: monospace;
      padding: 10px;
      border-radius: 4px;
      height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    ghost {
      display: none !important;
    }
  </style>
</head>

<body>

  <h1>GhostScript V2 Beta</h1>

  <textarea id="ghostSource" spellcheck="false">
out("Hello from GhostScript!")
var name = "Casper"
out("Ghost name: " .+ name .+ " the friendly spirit")
out("Testing math vs concat: " .+ (1 + 1) .+ " vs " .+ 1 .+ 1)

for (3)
  per (2)
    out("Nested loop tick! Parent loop: " .+ i)
  end
end
  </textarea>

  <label>Output JavaScript:</label>
  <pre id="jsOutput">// Transformed JS will appear here</pre>

  <button id="runBtn">Run</button>

  <h2>Console output:</h2>
  <pre id="consoleOutput">// Output appears here</pre>

  <ghost id="runner"></ghost>

  <script>
    const consoleOutput = document.getElementById('consoleOutput');
    const jsOutput = document.getElementById('jsOutput');
    const originalLog = console.log;
    const originalErr = console.error;

    console.log = (...args) => {
      consoleOutput.textContent += args.join(' ') + '\n';
      originalLog(...args);
    };

    console.error = (...args) => {
      consoleOutput.textContent += '[ERR] ' + args.join(' ') + '\n';
      originalErr(...args);
    };

    // ==========================================
    // PHASE 1: THE TOKENIZER (Lexer)
    // Isolates literal strings from language logic safely.
    // ==========================================
    function tokenize(code) {
      const tokens = [];
      let i = 0;

      while (i < code.length) {
        let char = code[i];

        // Skip Whitespace (but keep track of newlines for instruction separation)
        if (char === '\n') {
          tokens.push({ type: 'NEWLINE', value: '\n' });
          i++;
          continue;
        }
        if (/\s/.test(char)) {
          i++;
          continue;
        }

        // Skip Single Line Comments
        if (char === '/' && code[i + 1] === '/') {
          while (i < code.length && code[i] !== '\n') i++;
          continue;
        }

        // Handle String Literals (Prevents internal structural text damage)
        if (char === '"' || char === "'" || char === '`') {
          const quoteType = char;
          let strValue = "";
          i++; // Skip opener
          while (i < code.length && code[i] !== quoteType) {
            strValue += code[i];
            i++;
          }
          i++; // Skip closer
          tokens.push({ type: 'STRING', value: `${quoteType}${strValue}${quoteType}` });
          continue;
        }

        // Handle the Specific custom Concatenation Operator ".+"
        if (char === '.' && code[i + 1] === '+') {
          tokens.push({ type: 'CONCAT', value: '.+' });
          i += 2;
          continue;
        }

        // Handle Identifiers / Numbers / Control Keywords
        if (/[a-zA-Z0-9_$]/.test(char)) {
          let word = "";
          while (i < code.length && /[a-zA-Z0-9_$]/.test(code[i])) {
            word += code[i];
            i++;
          }
          tokens.push({ type: 'WORD', value: word });
          continue;
        }

        // Structural and Math Marks (parenthesis, braces, comparison operators)
        tokens.push({ type: 'OPERATOR', value: char });
        i++;
      }
      return tokens;
    }

    // ==========================================
    // PHASE 2: THE PARSER & CODE GENERATOR
    // Converts isolated tokens seamlessly into unified JavaScript.
    // ==========================================
function parseGhostScript(ghostSource) {
  let ghostCode = ghostSource;

  // 1. Extract and safeguard all string literals so we don't break them
  const strings = [];
  ghostCode = ghostCode.replace(/(["'`])(.*?)\1/g, (match) => {
    strings.push(match);
    return `__GHOST_STR_${strings.length - 1}__`;
  });

  // 2. Now that strings are safe, explicitly convert all instances of .+ into a safe addition pattern
  // We wrap both sides in String() to guarantee that 1 .+ 1 behaves as "1" + "1" -> "11"
  // This runs multiple times to catch long, chained connections (a .+ b .+ c)
  while (ghostCode.includes('.+')) {
    ghostCode = ghostCode.replace(/([a-zA-Z0-9_$\(\)]+)\s*\.\+\s*([a-zA-Z0-9_$\(\)]+)/g, 'String($1) + String($2)');
  }

  // 3. Put the original safe strings back exactly where they belong
  ghostCode = ghostCode.replace(/__GHOST_STR_(\d+)__/g, (match, index) => {
    return strings[parseInt(index)];
  });

  // 4. Map the standard keywords cleanly
  ghostCode = ghostCode.replace(/\bout\b/g, 'console.log');
  ghostCode = ghostCode.replace(/\berr\b/g, 'console.error');
  ghostCode = ghostCode.replace(/\bvar\b/g, 'let');
  ghostCode = ghostCode.replace(/\bwss\((.+?)\)/g, 'new WebSocket("wss://" + $1)');

  // 5. Build out line block rules
  const lines = ghostCode.split('\n').map(line => line.trim());
  const controlKeywords = ['if', 'else if', 'else', 'while', 'switch', 'for'];

  let outputLines = [];
  let blockStack = [];
  let loopDepth = 0;
  let activeLoopIterators = ['i'];

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    if (line === '' || line.startsWith('//')) continue;

    const firstWord = line.split(/[ (\t]/)[0];

    if (firstWord === 'fn') {
      line = line.replace(/^fn\s+(\w+)\s*\((.*?)\)/, 'function $1($2) {');
      blockStack.push('block');
    } 
    else if (firstWord === 'from') {
      const wsVar = line.match(/from\s*\(\s*(\w+)\s*\)/)?.[1];
      line = `${wsVar}.onmessage = async (event) => {`;
      blockStack.push('from');
    } 
    else if (firstWord === 'for') {
      const countMatch = line.match(/for\s*\(\s*(.+?)\s*\)/)?.[1];
      const iterVar = loopDepth === 0 ? 'i' : `i_${loopDepth}`;
      activeLoopIterators.push(iterVar);
      loopDepth++;
      line = `for (let ${iterVar} = 0; ${iterVar} < ${countMatch}; ${iterVar}++) {`;
      blockStack.push('block');
    } 
    else if (firstWord === 'per') {
      const moduloNum = line.match(/per\s*\(\s*(\d+)\s*\)/)?.[1];
      const scopeIterator = activeLoopIterators[activeLoopIterators.length - 1] || 'i';
      line = `if (${scopeIterator} % ${moduloNum} === 0) {`;
      blockStack.push('block');
    } 
    else if (firstWord === 'end') {
      if (blockStack.length > 0) {
        const closing = blockStack.pop();
        line = '}';
        if (activeLoopIterators.length > 1 && closing === 'block') {
          activeLoopIterators.pop();
          loopDepth--;
        }
      } else {
        line = '// stray end';
      }
    } 
    else if (controlKeywords.includes(firstWord)) {
      line += ' {';
      blockStack.push('block');
    }

    if (blockStack.includes('from')) {
      line = line.replace(/\b\w+\.msg\b/g, 'event.data');
    }

    outputLines.push(line);
  }

  while (blockStack.length > 0) {
    outputLines.push('}');
    blockStack.pop();
  }

  return outputLines.join('\n');
}

    // ==========================================
    // PHASE 3: ISOLATED CONTEXT EXECUTION
    // Runs scripts via standard global window safety context
    // ==========================================
    function runGhostTags() {
      const blocks = document.querySelectorAll('ghost');

      blocks.forEach(block => {
        const isExternal = block.hasAttribute('src');
        const runCode = code => {
          const parsed = parseGhostScript(code);
          try {
            const execWrapper = new Function(`return (async () => {\n${parsed}\n})()`);
            execWrapper();
          } catch (e) {
            console.error('GhostScript runtime error:', e);
          }
        };

        if (isExternal) {
          const src = block.getAttribute('src');
          fetch(src)
            .then(res => res.text())
            .then(runCode)
            .catch(err => {
              console.error(`GhostScript failed to load "${src}":`, err);
            });
        } else {
          runCode(block.textContent);
        }
      });
    }

    document.getElementById('runBtn').addEventListener('click', () => {
      const code = document.getElementById('ghostSource').value;
      document.getElementById('runner').textContent = code;
      consoleOutput.textContent = '';

      const transformed = parseGhostScript(code);
      jsOutput.textContent = transformed;

      runGhostTags();
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runGhostTags);
    } else {
      runGhostTags();
    }
  </script>

</body>

</html>
